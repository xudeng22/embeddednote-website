media:
  input: public/uploads
  output: /uploads
content:
  - name: articles_en
    label: English Articles
    type: collection
    path: src/content/articles/en
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
    fields:
      - {name: title, label: Title, type: string, required: true}
      - {name: description, label: Summary, type: text, required: true}
      - {name: locale, label: Language, type: string, default: en, required: true}
      - {name: translationKey, label: Translation Key, type: string, required: true}
      - {name: pubDate, label: Publication Date, type: date, required: true}
      - {name: category, label: Category, type: select, required: true, options: {values: ["open-source", "mcu-soc", "hardware", "connectivity", "display", "tools"]}}
      - {name: tags, label: Tags, type: string, list: true}
      - {name: draft, label: Draft, type: boolean, default: true}
      - {name: seoTitle, label: SEO Title, type: string}
      - {name: seoDescription, label: SEO Description, type: text}
      - {name: body, label: Article, type: rich-text}
  - name: articles_zh
    label: 中文文章
    type: collection
    path: src/content/articles/zh
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
    fields:
      - {name: title, label: 标题, type: string, required: true}
      - {name: description, label: 摘要, type: text, required: true}
      - {name: locale, label: 语言, type: string, default: zh, required: true}
      - {name: translationKey, label: 翻译关联键, type: string, required: true}
      - {name: pubDate, label: 发布日期, type: date, required: true}
      - {name: category, label: 技术分类, type: select, required: true, options: {values: ["open-source", "mcu-soc", "hardware", "connectivity", "display", "tools"]}}
      - {name: tags, label: 标签, type: string, list: true}
      - {name: draft, label: 草稿, type: boolean, default: true}
      - {name: seoTitle, label: SEO 标题, type: string}
      - {name: seoDescription, label: SEO 摘要, type: text}
      - {name: body, label: 正文, type: rich-text}
  - name: about_en
    label: About (English)
    type: file
    path: src/content/about/en.md
    format: yaml-frontmatter
    fields:
      - {name: title, label: Title, type: string, required: true}
      - {name: description, label: Description, type: text, required: true}
      - {name: locale, label: Language, type: string, default: en, required: true}
      - {name: body, label: Page Content, type: rich-text}
  - name: about_zh
    label: 关于页面（中文）
    type: file
    path: src/content/about/zh.md
    format: yaml-frontmatter
    fields:
      - {name: title, label: 标题, type: string, required: true}
      - {name: description, label: 描述, type: text, required: true}
      - {name: locale, label: 语言, type: string, default: zh, required: true}
      - {name: body, label: 页面正文, type: rich-text}
  - name: privacy_en
    label: Privacy Policy (English)
    type: file
    path: src/content/privacy/en.md
    format: yaml-frontmatter
    fields:
      - {name: title, label: Title, type: string, required: true}
      - {name: description, label: Description, type: text, required: true}
      - {name: locale, label: Language, type: string, default: en, required: true}
      - {name: body, label: Policy Content, type: rich-text}
  - name: privacy_zh
    label: 隐私政策（中文）
    type: file
    path: src/content/privacy/zh.md
    format: yaml-frontmatter
    fields:
      - {name: title, label: 标题, type: string, required: true}
      - {name: description, label: 描述, type: text, required: true}
      - {name: locale, label: 语言, type: string, default: zh, required: true}
      - {name: body, label: 政策正文, type: rich-text}
