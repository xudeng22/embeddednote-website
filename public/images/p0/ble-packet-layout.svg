<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-label="Bluetooth Low Energy packet layout from link layer header to ATT payload">
  <rect width="960" height="330" fill="#fbf8f2"/>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <text x="24" y="30" font-size="14" font-weight="700" fill="#a63927" letter-spacing="1.1">ONE ATT OPERATION, ON THE AIR</text>

    <!-- bar -->
    <g>
      <rect x="24" y="56" width="72" height="54" fill="#e7e0d4"/>
      <rect x="96" y="56" width="120" height="54" fill="#dcd3c4"/>
      <rect x="216" y="56" width="96" height="54" fill="#d2c8b6"/>
      <rect x="312" y="56" width="408" height="54" fill="#c9bd9f"/>
      <rect x="720" y="56" width="96" height="54" fill="#dcd3c4"/>
      <rect x="816" y="56" width="96" height="54" fill="#e7e0d4"/>
      <text x="60" y="88" font-size="13" text-anchor="middle" fill="#17211e">LL hdr</text>
      <text x="156" y="88" font-size="13" text-anchor="middle" fill="#17211e">L2CAP 4</text>
      <text x="264" y="88" font-size="13" text-anchor="middle" fill="#17211e">ATT 3</text>
      <text x="516" y="88" font-size="14" text-anchor="middle" font-weight="700" fill="#17211e">GATT value (up to MTU − 3)</text>
      <text x="768" y="88" font-size="13" text-anchor="middle" fill="#17211e">MIC 4*</text>
      <text x="864" y="88" font-size="13" text-anchor="middle" fill="#17211e">CRC 3</text>
    </g>

    <text x="24" y="136" font-size="12.5" fill="#59645e">* MIC appears only on an encrypted link. Preamble and access address sit in front of this frame and are counted in the airtime model.</text>

    <!-- numbers -->
    <g>
      <rect x="24" y="160" width="288" height="66" rx="6" fill="#ffffff" stroke="#d0c8bb"/>
      <text x="44" y="186" font-size="13" fill="#59645e">default ATT MTU</text>
      <text x="44" y="212" font-size="24" font-weight="700" fill="#17211e">23 B</text>
      <text x="120" y="212" font-size="13" fill="#59645e">→ 20 B payload</text>

      <rect x="336" y="160" width="288" height="66" rx="6" fill="#ffffff" stroke="#d0c8bb"/>
      <text x="356" y="186" font-size="13" fill="#59645e">negotiated MTU</text>
      <text x="356" y="212" font-size="24" font-weight="700" fill="#17211e">247 B</text>
      <text x="440" y="212" font-size="13" fill="#59645e">→ 244 B payload</text>

      <rect x="648" y="160" width="264" height="66" rx="6" fill="#ffffff" stroke="#d0c8bb"/>
      <text x="668" y="186" font-size="13" fill="#59645e">LL payload ceiling</text>
      <text x="668" y="212" font-size="24" font-weight="700" fill="#17211e">251 B</text>
      <text x="748" y="212" font-size="13" fill="#59645e">with DLE</text>
    </g>

    <text x="24" y="268" font-size="13" fill="#17211e">A 244-byte value plus 4 bytes of L2CAP and 3 of ATT fits in one 251-byte LL PDU.</text>
    <text x="24" y="292" font-size="13" fill="#17211e">Raise the MTU and this stops being true: L2CAP fragments, and the per-packet overhead doubles.</text>
  </g>
</svg>
