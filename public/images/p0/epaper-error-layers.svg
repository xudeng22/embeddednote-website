<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-label="Five layers of an e-paper image pipeline and the error signature each one produces">
  <rect width="960" height="470" fill="#fbf8f2"/>
  <text x="24" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#a63927" letter-spacing="1.2">WHERE THE ERROR COMES FROM</text>
  <text x="24" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#59645e">Read the symptom first, then walk down the stack. Most debugging starts one layer too low.</text>

  <g font-family="Segoe UI, Arial, sans-serif">
    <!-- layer 1 -->
    <rect x="24" y="78" width="912" height="66" rx="6" fill="#ffffff" stroke="#d0c8bb"/>
    <rect x="24" y="78" width="6" height="66" rx="3" fill="#8a9a8f"/>
    <text x="48" y="104" font-size="15" font-weight="700" fill="#17211e">1 · Source image</text>
    <text x="48" y="126" font-size="12.5" fill="#59645e">Aspect, crop, tone, exposure — the browser already resized it once.</text>
    <text x="640" y="104" font-size="12.5" font-weight="700" fill="#8a3f2c">Signature:</text>
    <text x="640" y="126" font-size="12.5" fill="#8a3f2c">stretched, cropped, or soft everywhere</text>

    <!-- layer 2 -->
    <rect x="24" y="152" width="912" height="66" rx="6" fill="#ffffff" stroke="#d0c8bb"/>
    <rect x="24" y="152" width="6" height="66" rx="3" fill="#b94530"/>
    <text x="48" y="178" font-size="15" font-weight="700" fill="#17211e">2 · Palette mapping</text>
    <text x="48" y="200" font-size="12.5" fill="#59645e">Software reference RGB versus the controller's native colour codes.</text>
    <text x="640" y="178" font-size="12.5" font-weight="700" fill="#8a3f2c">Signature:</text>
    <text x="640" y="200" font-size="12.5" fill="#8a3f2c">uniform hue shift across the whole frame</text>

    <!-- layer 3 -->
    <rect x="24" y="226" width="912" height="66" rx="6" fill="#ffffff" stroke="#d0c8bb"/>
    <rect x="24" y="226" width="6" height="66" rx="3" fill="#b94530"/>
    <text x="48" y="252" font-size="15" font-weight="700" fill="#17211e">3 · Packing and layout</text>
    <text x="48" y="274" font-size="12.5" fill="#59645e">Row stride, nibble order, rotation, inversion, bit depth.</text>
    <text x="640" y="252" font-size="12.5" font-weight="700" fill="#8a3f2c">Signature:</text>
    <text x="640" y="274" font-size="12.5" fill="#8a3f2c">shear, diagonal bands, mirroring, duplicated columns</text>

    <!-- layer 4 -->
    <rect x="24" y="300" width="912" height="66" rx="6" fill="#ffffff" stroke="#d0c8bb"/>
    <rect x="24" y="300" width="6" height="66" rx="3" fill="#8a9a8f"/>
    <text x="48" y="326" font-size="15" font-weight="700" fill="#17211e">4 · Driver and waveform</text>
    <text x="48" y="348" font-size="12.5" fill="#59645e">Refresh mode, LUT selection, BUSY handling, power sequencing.</text>
    <text x="640" y="326" font-size="12.5" font-weight="700" fill="#8a3f2c">Signature:</text>
    <text x="640" y="348" font-size="12.5" fill="#8a3f2c">faint previous image, weak contrast, wrong colours after mode change</text>

    <!-- layer 5 -->
    <rect x="24" y="374" width="912" height="66" rx="6" fill="#ffffff" stroke="#d0c8bb"/>
    <rect x="24" y="374" width="6" height="66" rx="3" fill="#8a9a8f"/>
    <text x="48" y="400" font-size="15" font-weight="700" fill="#17211e">5 · Panel and environment</text>
    <text x="48" y="422" font-size="12.5" fill="#59645e">Temperature, viewing light, panel batch, ageing, FPC seating.</text>
    <text x="640" y="400" font-size="12.5" font-weight="700" fill="#8a3f2c">Signature:</text>
    <text x="640" y="422" font-size="12.5" fill="#8a3f2c">one band, one corner, or different on two identical builds</text>
  </g>
</svg>
