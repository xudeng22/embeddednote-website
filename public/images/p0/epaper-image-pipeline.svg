<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img">
<title>epaper-image-pipeline</title>
<rect width="1200" height="540" fill="#f8f5ee"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#1d2926}.h{font-size:35px;font-weight:700}.sub{font-size:18px;fill:#65706a}.lbl{font-size:19px;font-weight:700}.small{font-size:16px;fill:#47534f}.white{fill:#ffffff}.mono{font-family:monospace;font-size:19px}.line{stroke:#b7b3a8;stroke-width:3;fill:none}.box{fill:#fff;stroke:#cecabe;stroke-width:2}.rust{fill:#ad4f3b}.green{fill:#356d61}.cream{fill:#f8f5ee}.pale{fill:#e8eee8}</style><text class="h" x="55" y="78">From source pixels to panel drive</text><text class="sub" x="55" y="115">Three different mappings must not be confused</text>
<rect class="box" x="45" y="178" rx="14" width="250" height="182"/><rect x="65" y="197" width="210" height="42" rx="5" fill="#d1a06c"/><rect x="65" y="239" width="210" height="42" fill="#7395ae"/><rect x="65" y="281" width="210" height="55" rx="5" fill="#74916b"/><text class="lbl" x="65" y="386">01 / Source image</text><text class="small" x="65" y="414">RGB, crop, tone</text>
<rect class="box" x="340" y="178" rx="14" width="250" height="182"/><g><rect x="360" y="203" width="50" height="105" fill="#201e1c"/><rect x="410" y="203" width="50" height="105" fill="#f3eee5"/><rect x="460" y="203" width="50" height="105" fill="#ddbb58"/><rect x="510" y="203" width="60" height="105" fill="#46717c"/></g><text class="lbl" x="360" y="386">02 / Palette</text><text class="small" x="360" y="414">Index 0, 1, 2, 3...</text>
<rect class="box" x="635" y="178" rx="14" width="250" height="182"/><text class="mono" x="652" y="247">01 23 45 ...</text><text class="small" x="652" y="292">RAW4 high nibble</text><text class="lbl" x="652" y="386">03 / Packing</text><text class="small" x="652" y="414">Stride + orientation</text>
