<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img">
<title>raw4-odd-width</title>
<rect width="1200" height="540" fill="#f8f5ee"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#1d2926}.h{font-size:35px;font-weight:700}.sub{font-size:18px;fill:#65706a}.lbl{font-size:19px;font-weight:700}.small{font-size:16px;fill:#47534f}.white{fill:#ffffff}.mono{font-family:monospace;font-size:19px}.line{stroke:#b7b3a8;stroke-width:3;fill:none}.box{fill:#fff;stroke:#cecabe;stroke-width:2}.rust{fill:#ad4f3b}.green{fill:#356d61}.cream{fill:#f8f5ee}.pale{fill:#e8eee8}</style><text class="h" x="55" y="73">RAW4: odd-width, unpadded example</text><text class="sub" x="55" y="112">5 x 2 pixels: the last pixel of row 0 shares a byte with the first pixel of row 1</text>
<text class="lbl" x="65" y="178">Rows (palette indexes)</text><g><rect x="65" y="190" width="62" height="62" rx="5" fill="#ded6c8"/><text x="87" y="232" font-size="24" font-weight="bold" fill="#17221f">0</text><rect x="135" y="190" width="62" height="62" rx="5" fill="#a1b3ae"/><text x="157" y="232" font-size="24" font-weight="bold" fill="#17221f">1</text><rect x="205" y="190" width="62" height="62" rx="5" fill="#dcb95c"/><text x="227" y="232" font-size="24" font-weight="bold" fill="#17221f">2</text><rect x="275" y="190" width="62" height="62" rx="5" fill="#698a96"/><text x="297" y="232" font-size="24" font-weight="bold" fill="#17221f">3</text><rect x="345" y="190" width="62" height="62" rx="5" fill="#c17f64"/><text x="367" y="232" font-size="24" font-weight="bold" fill="#17221f">4</text><rect x="65" y="266" width="62" height="62" rx="5" fill="#514d4a"/><text x="87" y="308" font-size="24" font-weight="bold" fill="#17221f">5</text><rect x="135" y="266" width="62" height="62" rx="5" fill="#ded6c8"/><text x="157" y="308" font-size="24" font-weight="bold" fill="#17221f">0</text><rect x="205" y="266" width="62" height="62" rx="5" fill="#a1b3ae"/><text x="227" y="308" font-size="24" font-weight="bold" fill="#17221f">1</text><rect x="275" y="266" width="62" height="62" rx="5" fill="#dcb95c"/><text x="297" y="308" font-size="24" font-weight="bold" fill="#17221f">2</text><rect x="345" y="266" width="62" height="62" rx="5" fill="#698a96"/><text x="367" y="308" font-size="24" font-weight="bold" fill="#17221f">3</text></g>
<text class="lbl" x="600" y="178">Continuous packed stream</text><text class="mono" x="600" y="235">01   23   45   01   23</text><text class="small" x="600" y="274">Byte 3 crosses the row boundary: 4 + 5</text><path class="line" d="M500 240H575"/><path d="M562 228L578 240L562 252" fill="none" stroke="#b94530" stroke-width="4"/>
<rect x="60" y="376" width="1080" height="113" rx="14" fill="#e6ede8"/><text class="lbl" x="85" y="416">Unpadded: 5 bytes. Row-aligned: 6 bytes.</text><text class="small" x="85" y="451">Never assume the controller expects the converter's software export format.</text></svg>
