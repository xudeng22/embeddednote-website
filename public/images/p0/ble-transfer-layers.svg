<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img">
<title>ble-transfer-layers</title>
<rect width="1200" height="540" fill="#f8f5ee"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#1d2926}.h{font-size:35px;font-weight:700}.sub{font-size:18px;fill:#65706a}.lbl{font-size:19px;font-weight:700}.small{font-size:16px;fill:#47534f}.white{fill:#ffffff}.mono{font-family:monospace;font-size:19px}.line{stroke:#b7b3a8;stroke-width:3;fill:none}.box{fill:#fff;stroke:#cecabe;stroke-width:2}.rust{fill:#ad4f3b}.green{fill:#356d61}.cream{fill:#f8f5ee}.pale{fill:#e8eee8}</style><text class="h" x="55" y="78">BLE file-transfer budget</text><text class="sub" x="55" y="117">Each layer reduces useful payload or schedules when it can move</text>
<g><rect class="box" x="45" y="175" rx="14" width="240" height="150"/><text class="lbl" x="65" y="224">File bytes</text><text class="mono" x="65" y="264">24,400 B</text><text class="small" x="65" y="295">App framing</text>
<rect class="box" x="335" y="175" rx="14" width="240" height="150"/><text class="lbl" x="355" y="224">ATT value</text><text class="mono" x="355" y="264">MTU - 3</text><text class="small" x="355" y="295">Header / API cap</text>
<rect class="box" x="625" y="175" rx="14" width="240" height="150"/><text class="lbl" x="645" y="224">Link layer</text><text class="mono" x="645" y="264">LL payload</text><text class="small" x="645" y="295">PHY + fragments</text>
<rect class="box" x="915" y="175" rx="14" width="240" height="150"/><text class="lbl" x="935" y="224">Events</text><text class="mono" x="935" y="264">20 ms</text><text class="small" x="935" y="295">Scheduling + flow</text></g>
<g stroke="#b94530" stroke-width="5" fill="none"><path d="M285 248H325M314 236L326 248L314 260"/><path d="M575 248H615M604 236L616 248L604 260"/><path d="M865 248H905M894 236L906 248L894 260"/></g>
<rect x="45" y="390" width="1110" height="96" rx="12" fill="#e6ede8"/><text class="lbl" x="65" y="427">Calculated schedule is not a receiver-side completion time.</text><text class="small" x="65" y="459">Measure accepted chunks, file checksum, and the final device-side operation.</text></svg>
