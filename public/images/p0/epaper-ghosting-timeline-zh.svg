<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" role="img" aria-label="残影在多次局刷中累积,并在全刷后清除">
  <rect width="960" height="320" fill="#fbf8f2"/>
  <text x="24" y="32" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#a63927" letter-spacing="1.2">局刷会累积残留</text>
  <text x="24" y="54" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#59645e">同一块屏、同一张新画面,四种不同的刷新历史。</text>

  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <g transform="translate(24,78)">
      <rect width="200" height="150" rx="6" fill="#ffffff" stroke="#17211e" stroke-width="2"/>
      <rect x="16" y="16" width="168" height="118" fill="#f4f0e7"/>
      <rect x="46" y="42" width="70" height="10" fill="#17211e"/>
      <rect x="46" y="62" width="110" height="8" fill="#5b655f"/>
      <rect x="46" y="78" width="96" height="8" fill="#5b655f"/>
      <text x="0" y="176" font-size="13" font-weight="700" fill="#17211e">全刷</text>
      <text x="0" y="194" font-size="12" fill="#59645e">干净基线</text>
    </g>

    <g transform="translate(252,78)">
      <rect width="200" height="150" rx="6" fill="#ffffff" stroke="#17211e" stroke-width="2"/>
      <rect x="16" y="16" width="168" height="118" fill="#f4f0e7"/>
      <rect x="46" y="42" width="70" height="10" fill="#17211e"/>
      <rect x="46" y="62" width="110" height="8" fill="#5b655f"/>
      <rect x="46" y="78" width="96" height="8" fill="#5b655f"/>
      <rect x="120" y="20" width="56" height="110" fill="#17211e" opacity="0.06"/>
      <text x="0" y="176" font-size="13" font-weight="700" fill="#17211e">局刷 5 次</text>
      <text x="0" y="194" font-size="12" fill="#59645e">右边缘出现淡淡残留</text>
    </g>

    <g transform="translate(480,78)">
      <rect width="200" height="150" rx="6" fill="#ffffff" stroke="#17211e" stroke-width="2"/>
      <rect x="16" y="16" width="168" height="118" fill="#f4f0e7"/>
      <rect x="46" y="42" width="70" height="10" fill="#17211e"/>
      <rect x="46" y="62" width="110" height="8" fill="#5b655f"/>
      <rect x="46" y="78" width="96" height="8" fill="#5b655f"/>
      <rect x="112" y="16" width="72" height="118" fill="#17211e" opacity="0.16"/>
      <rect x="16" y="16" width="168" height="118" fill="none" stroke="#b94530" stroke-dasharray="4 3"/>
      <text x="0" y="176" font-size="13" font-weight="700" fill="#b94530">局刷 20 次</text>
      <text x="0" y="194" font-size="12" fill="#59645e">残影已经成为画面的一部分</text>
    </g>

    <g transform="translate(708,78)">
      <rect width="200" height="150" rx="6" fill="#ffffff" stroke="#17211e" stroke-width="2"/>
      <rect x="16" y="16" width="168" height="118" fill="#f4f0e7"/>
      <rect x="46" y="42" width="70" height="10" fill="#17211e"/>
      <rect x="46" y="62" width="110" height="8" fill="#5b655f"/>
      <rect x="46" y="78" width="96" height="8" fill="#5b655f"/>
      <path d="M132 24 l10 10 -10 10" fill="none" stroke="#8a9a8f" stroke-width="2"/>
      <text x="0" y="176" font-size="13" font-weight="700" fill="#17211e">再次全刷</text>
      <text x="0" y="194" font-size="12" fill="#59645e">残留被清除</text>
    </g>
  </g>

  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <path d="M228 153 h18" stroke="#17211e" stroke-width="1.5" marker-end="url(#a)"/>
    <path d="M456 153 h18" stroke="#17211e" stroke-width="1.5" marker-end="url(#a)"/>
    <path d="M684 153 h18" stroke="#17211e" stroke-width="1.5" marker-end="url(#a)"/>
    <defs>
      <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
        <path d="M0 0 L10 5 L0 10 z" fill="#17211e"/>
      </marker>
    </defs>
    <text x="24" y="296" font-size="12.5" fill="#59645e">残留是"没走完"的颜料,不是没刷新的缓存。重复写同样的像素不会让它移动。</text>
    <text x="24" y="314" font-size="12.5" fill="#59645e">只有厂商提供的全刷波形才能真正重置历史——这就是驱动里那个计数器存在的理由。</text>
  </g>
</svg>
